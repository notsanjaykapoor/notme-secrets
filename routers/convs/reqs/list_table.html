<div class="flex flex-row mt-5">
    <div class="w-1/12"></div>
    <div class="w-10/12">
        {% if query_code == 0 %}
        <p class="text-xs font-bold text-black-700">
            {{query_result}}
        </p>
        {% else %}
        <p class="text-xs font-bold text-red-700">
            {{query_result}}
        </p>
        {% endif %}
    </div>
</div>

<div class="flex flex-row mt-10">
    <div class="w-1/12"></div>
    <table class="w-10/12">
        <thead class="font-normal text-left text-xs leading-6 text-center text-zinc-800">
            <tr class="">
                <th class="p-4 text-left text-xs/7">prompt</th>
                <th class="p-4">conv id</th>
                <th class="p-4">conv msgs</th>
                <th class="p-4 ">id</th>
            </tr>
        </thead>
        <tbody>
            {% for conv_req in conv_reqs_list %}
            <tr class="group hover:bg-zinc-50 odd:bg-white even:bg-slate-50 text-center text-xs">
                <td class="p-4 font-normal text-left">
                    <a href="/convs/{{conv_req.conv_id}}/msgs/{{conv_req.msgs_str}}" class="font-bold text-blue-700">
                        {{ conv_req.prompt }}
                    </a>
                </td>
                <td class="p-4 font-normal">{{ conv_req.conv_id }}</td>
                <td class="p-4 font-normal">{{ conv_req.msgs_count }}</td>
                <td class="p-4 font-normal">{{ conv_req.id }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
